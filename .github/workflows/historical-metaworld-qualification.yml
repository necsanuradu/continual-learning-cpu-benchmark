name: Original MetaWorld CPU physics fidelity qualification

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/historical-metaworld-qualification.yml'
      - 'scripts/historical_metaworld_cpu.py'
      - 'scripts/install_historical_metaworld.sh'

permissions:
  contents: read

jobs:
  physics-original:
    name: ${{ matrix.competitor }} / original MetaWorld physics / Python ${{ matrix.python }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - competitor: nevo
            python: '3.8'
          - competitor: wave
            python: '3.10'
    env:
      JAX_PLATFORM_NAME: cpu
      JAX_PLATFORMS: cpu
      CUDA_VISIBLE_DEVICES: '-1'
      MUJOCO_GL: osmesa
      WANDB_MODE: offline
      WANDB_DISABLED: 'true'
      PIP_NO_INPUT: '1'
    steps:
      - name: Checkout original-source diagnostic
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python for original competitor
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Obtain unchanged competitor source
        run: bash scripts/fetch_source.sh "${{ matrix.competitor }}"
      - name: Install public OS physics libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libosmesa6-dev libglew-dev libgl1-mesa-dev libglfw3 libglfw3-dev patchelf
      - name: Original historical MetaWorld and MuJoCo dependencies
        run: bash scripts/install_historical_metaworld.sh "${{ matrix.competitor }}"
      - name: Restore official legacy MuJoCo 2.0 engine (Nevo only)
        if: matrix.competitor == 'nevo'
        run: bash scripts/install_official_mujoco200.sh
      - name: Try native original MT50 creation reset and step
        run: timeout 150s python -u scripts/historical_metaworld_cpu.py "${{ matrix.competitor }}"
